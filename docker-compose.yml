services:
  app:
    build: .
    container_name: csp-agent-app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://csp_agent:csp_agent_dev_password@db:5432/csp_agent
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/.venv

  db:
    image: postgres:17
    container_name: csp-agent-db
    environment:
      POSTGRES_DB: csp_agent
      POSTGRES_USER: csp_agent
      POSTGRES_PASSWORD: csp_agent_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csp_agent -d csp_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
